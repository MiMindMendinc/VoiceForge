[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceforge"
description = "A local, free text-to-speech HTTP server."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dynamic = ["version", "dependencies"]

[project.scripts]
voiceforge = "voiceforge_cli:main"

[tool.setuptools]
py-modules = ["server", "download_models", "voiceforge_cli"]
packages = ["tts"]

[tool.setuptools.dynamic]
version = { attr = "server.__version__" }
dependencies = { file = ["requirements.txt"] }
