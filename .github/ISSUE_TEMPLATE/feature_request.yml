name: Feature request
description: Suggest an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: want
    attributes:
      label: What you want
      description: Describe the feature in a sentence or two.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it helps
      description: What problem does this solve, or what would it let you do?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you use VoiceForge today
      description: Optional. A short note about your setup is enough.
